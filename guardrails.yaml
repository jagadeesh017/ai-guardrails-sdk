pipeline:
  input_guardrails:
    - type: max_length
      maximum: 100
    - type: blocked_words
      words: ["password", "secret", "api_key"]
      action: block
    - type: pii
      entities: ["email", "phone", "ssn", "credit_card", "api_key"]
      action: block
    - type: toxicity
      threshold: 0.5
      action: block
    - type: prompt_injection
      action: block
    - type: topic
      denied_topics: ["violence", "illegal", "self_harm", "hate_speech"]
      action: block
    - type: rate_limiter
      requests_per_minute: 60
      requests_per_hour: 1000
      action: throttle
    - type: budget
      daily_token_limit: 100000
      daily_cost_limit_usd: 50.0
      cost_per_1k_tokens: 0.01
      action: block
  output_guardrails:
    - type: blocked_words
      words: ["secret", "password", "internal"]
      action: block
    - type: pii
      entities: ["email", "phone", "ssn"]
      action: block
    - type: json_schema
      schema:
        required: ["response"]
        properties:
          response: {type: "string"}
      action: retry
      max_retries: 3
    - type: hallucination
      context: "The capital of France is Paris. It is known for the Eiffel Tower."
      threshold: 0.5
      action: warn
    - type: pii_leak
      entities: ["email", "phone", "ssn"]
      action: redact
    - type: brand_filter
      blocked_terms: ["competitor", "internal_codename"]
      replacement: "[BRAND]"
      action: redact
    - type: audit_logger
      log_level: info
      include_payloads: false
      action: log