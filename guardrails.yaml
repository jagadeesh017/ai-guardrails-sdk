pipeline:
  input_guardrails:
    - type: max_length
      maximum: 100
    - type: blocked_words
      words: ["password", "secret", "api_key"]
      action: block
    - type: pii
      entities: ["email", "phone", "ssn", "credit_card", "api_key"]
      action: block
    - type: toxicity
      threshold: 0.5
      action: block
    - type: prompt_injection
      action: block
    - type: topic
      denied_topics: ["violence", "illegal", "self_harm", "hate_speech"]
      action: block
  output_guardrails:
    - type: blocked_words
      words: ["secret", "password", "internal"]
      action: block
    - type: pii
      entities: ["email", "phone", "ssn"]
      action: block